name: gba-build
on:
  push:
    paths: ["GBA/**", ".github/workflows/gba-build.yml"]
  pull_request:
    paths: ["GBA/**"]
jobs:
  host-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: GBA } }
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/gen_data.py --check
      - run: g++ -std=c++20 -O2 -Wall -Iinclude tests/core_tests.cpp -o core_tests && ./core_tests
  rom:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    defaults: { run: { working-directory: GBA } }
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch 21.8.0 https://github.com/GValiente/butano.git /opt/butano
      - run: make -j2 BUTANO_PATH=/opt/butano/butano PYTHON=python3
      - uses: actions/upload-artifact@v4
        with: { name: PlanBudowlanyRogue, path: GBA/*.gba }
