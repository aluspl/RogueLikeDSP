name: core-tests
on:
  push:
    branches: [godot-migration]
    paths: ["GODOT/**", "GBA/data/game.json", ".github/workflows/godot-core-tests.yml"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # Rdzeń + testy (w tym test złoty zgodności z GBA i balans na botach)
      - run: dotnet test GODOT/LifeLike.sln --configuration Release
      # Projekt Godota musi się kompilować (Godot.NET.Sdk z NuGet, bez edytora); kopiuje też GBA/data/game.json
      - run: dotnet build GODOT/godot/LifeLike.Game.csproj --configuration Release
