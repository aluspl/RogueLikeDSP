name: core-tests
on:
  push:
    branches: [godot-migration]
    paths: ["GODOT/**", ".github/workflows/godot-core-tests.yml"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test GODOT/LifeLike.sln --configuration Release
