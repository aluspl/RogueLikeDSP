# Wydanie: ROM GBA + GitHub Release, TestFlight (iOS) i Google Play (Android, ścieżka internal).
# Start: tag v0.21.* albo ręcznie (Actions -> release -> Run workflow, z wyborem platform).
# Sekrety (Settings -> Secrets and variables -> Actions) – lista i jak je przygotować: .github/RELEASE.md.
name: release
on:
  push:
    tags: ["v0.21.*"]
  workflow_dispatch:
    inputs:
      ios: { description: "TestFlight", type: boolean, default: true }
      android: { description: "Google Play (internal)", type: boolean, default: true }

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BUILDS: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable

jobs:
  rom:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20241104
    defaults: { run: { working-directory: GBA } }
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 --branch 21.8.0 https://github.com/GValiente/butano.git /opt/butano
      - run: make -j2 BUTANO_PATH=/opt/butano/butano PYTHON=python3
      - name: Nazwa z wersją
        run: |
          VER=$(python3 -c 'import json; print(json.load(open("data/game.json"))["version"])')
          cp PlanBudowlanyRogue.gba "PlanBudowlanyRogue-$VER.gba"
      - uses: actions/upload-artifact@v4
        with: { name: rom, path: "GBA/PlanBudowlanyRogue-v*.gba" }

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: rom
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: rom }
      - name: Notatki z CHANGELOG
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v t="## $TAG" 'index($0,t)==1{f=1;next} /^## v/{if(f)exit} f' GBA/CHANGELOG.md > notes.md
          test -s notes.md || echo "Zobacz GBA/CHANGELOG.md" > notes.md
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" PlanBudowlanyRogue-*.gba GBA/CHANGELOG.md --clobber \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md PlanBudowlanyRogue-*.gba GBA/CHANGELOG.md

  ios:
    if: github.event_name == 'push' || inputs.ios
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - name: Godot .NET + szablony eksportu
        run: |
          curl -sSL -o godot.zip "$GODOT_BUILDS/Godot_v${GODOT_VERSION}-stable_mono_macos.universal.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$(find "$RUNNER_TEMP/godot" -path '*Contents/MacOS/Godot' | head -1)" >> "$GITHUB_ENV"
          curl -sSL -o tpl.tpz "$GODOT_BUILDS/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          D="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$D" && unzip -q tpl.tpz -d tplx && cp -R tplx/templates/* "$D/"
      - name: Certyfikat dystrybucyjny i klucz API (tymczasowy pęk kluczy)
        env:
          P12: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          ASC_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/ci.keychain-db"; KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "$ASC_P8" | base64 --decode > "$RUNNER_TEMP/asc.p8"
          pip3 install --quiet --break-system-packages cryptography || pip3 install --quiet cryptography
      - name: GODOT/.env.local z sekretów
        run: |
          cat > GODOT/.env.local <<EOF
          ASC_KEY=$RUNNER_TEMP/asc.p8
          ASC_KEY_ID=${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID=${{ secrets.APPLE_TEAM_ID }}
          UDID=none
          EOF
      - run: GODOT/tools/testflight_upload.sh

  android:
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Godot .NET + szablony eksportu + ustawienia SDK
        run: |
          curl -sSL -o godot.zip "$GODOT_BUILDS/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$(find "$RUNNER_TEMP/godot" -type f -name 'Godot_v*mono_linux.x86_64' | head -1)" >> "$GITHUB_ENV"
          curl -sSL -o tpl.tpz "$GODOT_BUILDS/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          D="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          mkdir -p "$D" && unzip -q tpl.tpz -d tplx && cp -R tplx/templates/* "$D/"
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.7.tres"
      - name: Klucz uploadu i konto serwisowe
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KS" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY" > "$RUNNER_TEMP/play.json"
          pip3 install --quiet cryptography
          cat > GODOT/.env.local <<EOF
          ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks
          ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON=$RUNNER_TEMP/play.json
          EOF
      - run: GODOT/tools/android_release.sh --upload
